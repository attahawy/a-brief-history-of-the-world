<VirtualHost *:80>
    ServerName a-brief-history-of-the-world.localhost
    DocumentRoot "/Users/samy/Sites/a-brief-history-of-the-world/dist"
    DirectoryIndex index.html

    <Directory "/Users/samy/Sites">
        AllowOverride None
    </Directory>

    <Directory "/Users/samy/Sites/a-brief-history-of-the-world/dist">
        Options -Indexes +FollowSymLinks
        AllowOverride None
        Require local
    </Directory>

    ErrorLog "/opt/homebrew/var/log/httpd/a-brief-history-of-the-world-error_log"
    CustomLog "/opt/homebrew/var/log/httpd/a-brief-history-of-the-world-access_log" common
</VirtualHost>
